plugins {
    id 'com.android.application'
}

android {
    namespace 'com.labalsera.sistemamedico'
    compileSdk 34

    defaultConfig {
        applicationId 'com.labalsera.sistemamedico'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore.p12')
            storeType 'pkcs12'
            storePassword 'labalsera2026'
            keyAlias 'labalsera'
            keyPassword 'labalsera2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
